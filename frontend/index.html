<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthquake Forecast Platform</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #fff;
        }

        #container { display: flex; height: 100vh; }
        #map { flex: 1; background: #1e293b; }

        #sidebar {
            width: 420px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            overflow-y: auto;
            border-left: 2px solid #0ea5e9;
            box-shadow: -4px 0 20px rgba(0,0,0,0.5);
        }

        .sidebar-content { padding: 24px; }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .controls {
            background: rgba(30, 41, 59, 0.8);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group:last-child { margin-bottom: 0; }

        .controls label {
            font-size: 12px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls input {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            transition: all 0.2s;
        }

        .controls input:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 8px rgba(14, 165, 233, 0.3);
        }

        #results {
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .result-section {
            margin-bottom: 20px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        h2 {
            font-size: 14px;
            color: #0ea5e9;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .location-info {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .risk-gauge {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .risk-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #f59e0b, #ef4444);
            transition: width 0.3s;
        }

        .magnitude-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin: 6px 0;
            background: #0f172a;
            border-left: 3px solid #666;
            border-radius: 4px;
            font-size: 13px;
        }

        .mag-m3 { border-left-color: #22c55e; }
        .mag-m4 { border-left-color: #84cc16; }
        .mag-m5 { border-left-color: #eab308; }
        .mag-m6 { border-left-color: #f59e0b; }
        .mag-m7 { border-left-color: #ef4444; }

        .mag-label { color: #cbd5e1; }
        .mag-value {
            font-family: 'Courier New', monospace;
            color: #0ea5e9;
            font-weight: 600;
        }

        .satellite-preview {
            width: 100%;
            height: 200px;
            background: #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 2px dashed rgba(14, 165, 233, 0.3);
            overflow: hidden;
        }

        .satellite-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .satellite-loading {
            color: #94a3b8;
            font-size: 12px;
        }

        .exposure-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .exposure-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid rgba(148, 163, 183, 0.1);
        }

        .exposure-label {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .exposure-value {
            font-size: 18px;
            font-weight: 700;
            color: #0ea5e9;
        }

        .risk-score {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 12px 0;
        }

        .context-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }

        .context-item {
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
            border-left: 2px solid #0ea5e9;
        }

        .context-label {
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .context-value {
            color: #6366f1;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .placeholder {
            color: #475569;
            text-align: center;
            padding: 40px 20px;
            font-style: italic;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            color: #0ea5e9;
            font-size: 13px;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(14, 165, 233, 0.3);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <div class="sidebar-content">
                <h1>Earthquake Forecast</h1>
                <p class="subtitle">Click on map to compute local seismic hazard</p>

                <div class="controls">
                    <div class="control-group">
                        <label>Forecast window (days)</label>
                        <input type="number" id="days" value="30" min="1" max="365" />
                    </div>
                    <div class="control-group">
                        <label>Search radius (km)</label>
                        <input type="number" id="radius" value="100" min="10" max="500" />
                    </div>
                </div>

                <div id="results">
                    <div class="result-section">
                        <p class="placeholder">Click on the map to compute forecast</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 18,
        }).addTo(map);

        let activeMarker = null;
        let activeCircle = null;

        map.on('click', (e) => {
            const { lat, lng } = e.latlng;

            if (activeMarker) map.removeLayer(activeMarker);
            if (activeCircle) map.removeLayer(activeCircle);

            activeMarker = L.circleMarker([lat, lng], {
                radius: 10,
                fillColor: '#0ea5e9',
                color: '#fff',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);

            const radius = parseInt(document.getElementById('radius').value);
            activeCircle = L.circle([lat, lng], {
                radius: radius * 1000,
                color: '#0ea5e9',
                fillColor: '#0ea5e9',
                fillOpacity: 0.05,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map);

            forecast(lat, lng);
        });

        async function forecast(lat, lon) {
            const days = document.getElementById('days').value;
            const radius = document.getElementById('radius').value;

            document.getElementById('results').innerHTML =
                '<div class="result-section"><div class="loading"><span class="spinner"></span>Computing...</div></div>';

            try {
                const [forecastRes, vulnRes] = await Promise.all([
                    fetch(`/forecast?lat=${lat}&lon=${lon}&days=${days}&radius_km=${radius}`),
                    fetch(`/vulnerability?lat=${lat}&lon=${lon}&zoom=13`).catch(() => null),
                ]);
                const forecastData = await forecastRes.json();
                const vulnData = vulnRes && vulnRes.ok ? await vulnRes.json() : null;
                renderResults(forecastData, vulnData);
            } catch (e) {
                document.getElementById('results').innerHTML =
                    `<div class="result-section"><div class="error">Error: ${e.message}</div></div>`;
            }
        }

        function renderResults(data, vuln) {
            const probs = data.probabilities;
            const feats = data.features;
            const lat = data.location.lat.toFixed(2);
            const lon = data.location.lon.toFixed(2);
            const m5_prob = probs['M_ge_5'] || 0;

            let html = `<div class="result-section">
                <h2>Location</h2>
                <div class="location-info">
                    <strong>${lat}°, ${lon}°</strong><br>
                    Window: ${data.days} days | Radius: ${data.radius_km} km
                </div>
                <div id="mini-map" style="width: 100%; height: 150px; margin-top: 12px; border-radius: 6px; border: 1px solid rgba(148, 163, 184, 0.2);"></div>
            </div>`;

            // Hazard section
            html += `<div class="result-section">
                <h2>Seismic Hazard</h2>`;

            const labels = {
                'M_ge_3': { label: 'M ≥ 3.0', class: 'mag-m3' },
                'M_ge_4': { label: 'M ≥ 4.0', class: 'mag-m4' },
                'M_ge_5': { label: 'M ≥ 5.0', class: 'mag-m5' },
                'M_ge_6': { label: 'M ≥ 6.0', class: 'mag-m6' },
                'M_ge_7': { label: 'M ≥ 7.0', class: 'mag-m7' },
            };

            for (const [key, { label, class: cls }] of Object.entries(labels)) {
                if (probs[key] === undefined) continue;
                const pct = (probs[key] * 100).toFixed(1);
                html += `<div class="magnitude-card ${cls}">
                    <span class="mag-label">${label}</span>
                    <span class="mag-value">${pct}%</span>
                </div>`;
            }

            html += `<div class="risk-gauge">
                <div class="risk-fill" style="width: ${Math.min(100, m5_prob * 300)}%"></div>
            </div>
            </div>`;

            // Vulnerability section
            if (vuln) {
                const exposure = vuln.vulnerability_score;
                const hazard = m5_prob;
                const riskScore = (hazard * exposure).toFixed(1);
                const riskLevel = riskScore < 2 ? 'LOW' : riskScore < 5 ? 'MODERATE' : 'HIGH';

                html += `<div class="result-section">
                    <h2>Exposure</h2>
                    <div style="text-align: center;">
                        <div class="exposure-value">${exposure.toFixed(1)} / 100</div>
                        <div style="color: #94a3b8; font-size: 11px; margin-top: 4px;">land-use vulnerability</div>
                    </div>
                </div>`;

                html += `<div class="result-section">
                    <h2>Combined Risk</h2>
                    <div style="text-align: center; margin-bottom: 12px;">
                        <div class="risk-score">${riskScore}</div>
                        <div style="color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">${riskLevel}</div>
                    </div>
                    <div style="color: #cbd5e1; font-size: 11px; line-height: 1.5;">
                        <strong>Risk = P(M≥5) × Exposure</strong><br>
                        Exposure from satellite land-use classification
                    </div>
                </div>`;
            }

            // Context section
            html += `<div class="result-section">
                <h2>Seismic Context</h2>
                <div class="context-grid">
                    <div class="context-item">
                        <div class="context-label">Events in 10y</div>
                        <div class="context-value">${feats.n_3650d || 0}</div>
                    </div>
                    <div class="context-item">
                        <div class="context-label">Max mag (1y)</div>
                        <div class="context-value">${(feats.max_mag_365d || 0).toFixed(1)}</div>
                    </div>
                    <div class="context-item">
                        <div class="context-label">Days since M≥5</div>
                        <div class="context-value">${Math.min(9999, feats.days_since_m5 || 0).toFixed(0)}</div>
                    </div>
                    <div class="context-item">
                        <div class="context-label">Depth (avg)</div>
                        <div class="context-value">${(feats.mean_depth_365d || 0).toFixed(1)} km</div>
                    </div>
                    <div class="context-item">
                        <div class="context-label">To plate</div>
                        <div class="context-value">${(feats.dist_to_plate || 0).toFixed(0)} km</div>
                    </div>
                    <div class="context-item">
                        <div class="context-label">M≥5 nearby</div>
                        <div class="context-value">${feats.n_m5_ring_10y || 0}</div>
                    </div>
                </div>
            </div>`;

            document.getElementById('results').innerHTML = html;

            // Render mini-map in the location section
            setTimeout(() => {
                const miniMapEl = document.getElementById('mini-map');
                const radius = parseInt(document.getElementById('radius').value);

                // Destroy old map if it exists
                if (miniMapEl._leafletMap) {
                    miniMapEl._leafletMap.remove();
                    miniMapEl._leafletMap = null;
                }

                const miniMap = L.map(miniMapEl, {
                    dragging: false,
                    zoomControl: false,
                    scrollWheelZoom: false,
                    doubleClickZoom: false,
                    touchZoom: false,
                    keyboard: false
                }).setView([lat, lon], 10);

                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri',
                    maxZoom: 18,
                }).addTo(miniMap);

                // Add radius circle
                const circle = L.circle([lat, lon], {
                    radius: radius * 1000,
                    color: '#0ea5e9',
                    fillColor: '#0ea5e9',
                    fillOpacity: 0.1,
                    weight: 2.5,
                    dashArray: '4, 3'
                }).addTo(miniMap);

                // Add center marker
                L.circleMarker([lat, lon], {
                    radius: 7,
                    fillColor: '#fff',
                    color: '#0ea5e9',
                    weight: 2.5,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(miniMap);

                miniMapEl._leafletMap = miniMap;
                miniMap.invalidateSize();

                // Fit the circle perfectly in the map view
                miniMap.fitBounds(circle.getBounds(), { padding: [30, 30] });
            }, 100);
        }

        document.getElementById('radius').addEventListener('change', () => {
            if (activeCircle && activeMarker) {
                const lat = activeMarker.getLatLng().lat;
                const lng = activeMarker.getLatLng().lng;
                const radius = parseInt(document.getElementById('radius').value);

                map.removeLayer(activeCircle);
                activeCircle = L.circle([lat, lng], {
                    radius: radius * 1000,
                    color: '#0ea5e9',
                    fillColor: '#0ea5e9',
                    fillOpacity: 0.05,
                    weight: 2,
                    dashArray: '5, 5'
                }).addTo(map);

                forecast(lat, lng);
            }
        });
    </script>
</body>
</html>
