<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Earthquake Forecasting Platform</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; }
        #container { display: flex; height: 100vh; }
        #map { flex: 1; }
        #sidebar {
            width: 360px;
            padding: 20px;
            background: #f5f5f5;
            overflow-y: auto;
            border-left: 1px solid #ddd;
        }
        h1 { font-size: 18px; margin: 0 0 10px; }
        h2 { font-size: 15px; margin: 20px 0 8px; color: #444; }
        .info { color: #666; font-size: 13px; margin-bottom: 16px; }
        .controls { margin-bottom: 16px; }
        .controls label { font-size: 13px; display: block; margin: 8px 0 4px; color: #444; }
        .controls input { width: 100%; padding: 6px; box-sizing: border-box; }
        .prob-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 4px 0;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #888;
        }
        .prob-row.m3 { border-color: #4caf50; }
        .prob-row.m4 { border-color: #8bc34a; }
        .prob-row.m5 { border-color: #ffc107; }
        .prob-row.m6 { border-color: #ff9800; }
        .prob-row.m7 { border-color: #f44336; }
        .prob-row .label { font-weight: 500; }
        .prob-row .value { font-family: monospace; }
        .features {
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            max-height: 240px;
            overflow-y: auto;
        }
        .features div { padding: 2px 0; }
        .placeholder { color: #999; font-style: italic; padding: 20px 0; }
    </style>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <h1>🌍 Earthquake Forecast</h1>
            <p class="info">Click anywhere on the map to forecast earthquake probabilities for that region.</p>
            
            <div class="controls">
                <label>Time window (days)</label>
                <input type="number" id="days" value="30" min="1" max="365" />
                <label>Search radius (km)</label>
                <input type="number" id="radius" value="100" min="10" max="500" />
            </div>
            
            <div id="results">
                <p class="placeholder">No location selected.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 18,
        }).addTo(map);

        let activeMarker = null;
        let activeCircle = null;

        async function forecast(lat, lon) {
            const days = document.getElementById('days').value;
            const radius = document.getElementById('radius').value;
            const url = `/forecast?lat=${lat}&lon=${lon}&days=${days}&radius_km=${radius}`;
            
            document.getElementById('results').innerHTML = '<p class="placeholder">Loading...</p>';
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                renderResults(data);
            } catch (e) {
                document.getElementById('results').innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
            }
        }

        function renderResults(data) {
            const probs = data.probabilities;
            const feats = data.features;
            const lat = data.location.lat.toFixed(3);
            const lon = data.location.lon.toFixed(3);

            let html = `
                <h2>Forecast</h2>
                <div class="info">
                    Location: ${lat}°, ${lon}°<br>
                    Window: next ${data.days} days<br>
                    Radius: ${data.radius_km} km
                </div>
            `;

            const labels = {
                'M_ge_3': ['m3', 'M ≥ 3.0'],
                'M_ge_4': ['m4', 'M ≥ 4.0'],
                'M_ge_5': ['m5', 'M ≥ 5.0'],
                'M_ge_6': ['m6', 'M ≥ 6.0'],
                'M_ge_7': ['m7', 'M ≥ 7.0'],
            };
            for (const [key, [cls, label]] of Object.entries(labels)) {
                if (probs[key] === undefined) continue;
                const pct = (probs[key] * 100).toFixed(2);
                html += `<div class="prob-row ${cls}">
                    <span class="label">${label}</span>
                    <span class="value">${pct}%</span>
                </div>`;
            }

            html += '<h2>Region context</h2><div class="features">';
            const display = {
                'n_30d': 'Quakes in last 30d',
                'n_365d': 'Quakes in last year',
                'n_3650d': 'Quakes in last 10y',
                'max_mag_365d': 'Max mag last year',
                'days_since_m4': 'Days since last M≥4',
                'days_since_m5': 'Days since last M≥5',
                'b_value_10y': 'b-value (10y)',
                'mean_depth_365d': 'Mean depth (km)',
                'dist_to_plate': 'Distance to plate (km)',
            };
            for (const [k, label] of Object.entries(display)) {
                let v = feats[k];
                if (v === null || v === undefined) v = '—';
                else if (typeof v === 'number') v = v.toFixed(2);
                html += `<div><strong>${label}:</strong> ${v}</div>`;
            }
            html += '</div>';

            document.getElementById('results').innerHTML = html;
        }

        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;

            if (activeMarker) map.removeLayer(activeMarker);
            if (activeCircle) map.removeLayer(activeCircle);

            activeMarker = L.marker([lat, lng]).addTo(map);
            const radius = parseFloat(document.getElementById('radius').value) * 1000;
            activeCircle = L.circle([lat, lng], {
                radius: radius,
                color: '#2196f3',
                fillColor: '#2196f3',
                fillOpacity: 0.15,
                weight: 2,
            }).addTo(map);

            await forecast(lat, lng);
        });
    </script>
</body>
</html>
